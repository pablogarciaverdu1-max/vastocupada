<style>
  :root {
    --noche: #14213d;
    --noche-hover: #22335a;
    --naranja: #ff9f1c;
    --naranja-hover: #ffb24a;
    --bruma: #eef1f8;
    --linea: #dce1ec;
    --tinta: #3a4560;
    --gris: #4a5570;
    --gris-claro: #5b6680;
    --borde: #7c869c;
    --titulo: "Bricolage Grotesque", system-ui, sans-serif;
    --texto: "DM Sans", system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #fff; color: var(--noche); font-family: var(--texto); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
  h1, h2, p, ol, ul { margin: 0; padding: 0; }
  ol, ul { list-style: none; }
  img { display: block; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--naranja); outline-offset: 3px; }
  .fondo-naranja :focus-visible { outline-color: var(--noche); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Botones (píldoras, mínimo 44 px) ---------- */
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 999px; font-weight: 700; transition: background-color .15s; }
  .btn-principal { width: 100%; height: 60px; padding: 0 24px; background: var(--noche); color: #fff; font-size: 17px; }
  .btn-principal:hover:not(:disabled) { background: var(--noche-hover); }
  .btn-principal:disabled { background: var(--linea); color: var(--gris); }
  .btn-naranja { height: 62px; padding: 0 32px; background: var(--naranja); color: var(--noche); font-size: 18px; width: 100%; }
  .btn-naranja:hover { background: var(--naranja-hover); }
  .btn-secundario { width: 100%; height: 52px; padding: 0 24px; border: 2px solid var(--noche); background: #fff; color: var(--noche); font-size: 15px; }
  .btn-secundario:hover { background: var(--bruma); }
  .btn-redondo { width: 44px; height: 44px; flex-shrink: 0; border: 2px solid var(--noche); background: #fff; color: var(--noche); border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  .btn-redondo:hover { background: var(--bruma); }

  /* ---------- Inicio ---------- */
  .inicio { background: var(--noche); color: #fff; min-height: 100dvh; }
  .inicio-grid { max-width: 560px; margin: 0 auto; min-height: 100dvh; padding: 32px 28px; display: grid; align-items: center; gap: 48px; }
  .inicio-bloque { display: flex; flex-direction: column; gap: 36px; }
  .inicio-marca { display: flex; flex-direction: column; gap: 18px; }
  .raya { width: 56px; height: 6px; border-radius: 3px; background: var(--naranja); }
  .marca { font-family: var(--titulo); font-weight: 800; font-size: 78px; line-height: .9; letter-spacing: -2.5px; color: var(--naranja); }
  .lema { font-family: var(--titulo); font-weight: 500; font-size: 26px; line-height: 1.2; }
  .miniaturas-fila { display: flex; align-items: center; gap: 14px; }
  .miniaturas { display: flex; flex-shrink: 0; }
  .miniaturas img { width: 56px; height: 56px; object-fit: cover; border-radius: 50%; border: 3px solid var(--noche); }
  .miniaturas img + img { margin-left: -14px; }
  .nota { font-size: 14px; line-height: 1.35; color: #dce1ec; }
  .collage { display: none; }

  /* ---------- Pantallas blancas ---------- */
  .contenedor { max-width: 576px; margin: 0 auto; }
  .cabeza { display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 16px; }
  .cabeza-fila { display: flex; justify-content: space-between; align-items: center; }
  .contador { background: var(--naranja); border-radius: 999px; padding: 10px 16px; font-size: 15px; font-weight: 700; }
  .titulo { font-family: var(--titulo); font-weight: 800; font-size: 36px; line-height: 1; letter-spacing: -1px; }
  .subtitulo { font-size: 15px; line-height: 1.4; margin-top: 6px; }
  .con-barra { padding-bottom: 150px; }
  .barra { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--linea); padding: 14px 20px max(28px, env(safe-area-inset-bottom)); }
  .barra > div { max-width: 536px; margin: 0 auto; }

  /* Fichas de platos */
  .fichas { display: grid; gap: 12px; padding: 0 20px; }
  .ficha { display: flex; gap: 14px; padding: 12px; border-radius: 20px; background: var(--bruma); }
  .ficha.elegido { outline: 3px solid var(--naranja); outline-offset: -3px; }
  .ficha-foto { width: 96px; height: 112px; flex-shrink: 0; object-fit: cover; border-radius: 14px; }
  .ficha-cuerpo { display: flex; gap: 14px; flex-grow: 1; min-width: 0; }
  .ficha-texto { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0; }
  .categoria { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--gris); }
  .ficha-nombre { font-family: var(--titulo); font-weight: 700; font-size: 18px; line-height: 1.15; }
  .ficha-desc { font-size: 13px; line-height: 1.35; color: var(--tinta); }
  .ficha-accion { display: flex; align-items: center; flex-shrink: 0; }
  .mas { width: 52px; height: 52px; border-radius: 50%; border: 0; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: var(--noche); color: #fff; transition: background-color .15s; }
  .mas:hover { background: var(--noche-hover); }
  .mas[aria-pressed="true"] { background: var(--naranja); color: var(--noche); }
  .mas[aria-pressed="true"]:hover { background: var(--naranja-hover); }
  .mas:disabled { background: #fff; border: 2px solid var(--borde); color: var(--gris-claro); }
  .aviso { min-height: 1em; padding: 16px 20px; text-align: center; font-size: 14px; font-weight: 700; }
  .panel { display: none; }

  /* Resumen */
  .resumen-grid { display: grid; gap: 20px; padding: 0 20px; grid-template-areas: "platos" "calendario" "datos"; }
  .zona-platos { grid-area: platos; display: flex; flex-direction: column; }
  .zona-calendario { grid-area: calendario; }
  .zona-datos { grid-area: datos; }
  .lista-item { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 2px solid var(--noche); }
  .num { width: 28px; flex-shrink: 0; font-family: var(--titulo); font-weight: 700; font-size: 18px; }
  .lista-foto { width: 60px; height: 60px; flex-shrink: 0; object-fit: cover; border-radius: 12px; }
  .lista-nombre { flex-grow: 1; min-width: 0; font-family: var(--titulo); font-weight: 700; font-size: 17px; line-height: 1.2; }
  .vacio { padding: 32px 0; border-top: 2px solid var(--noche); font-size: 16px; line-height: 1.5; }
  .tarjeta { background: var(--bruma); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .tarjeta h2 { font-family: var(--titulo); font-weight: 700; font-size: 20px; line-height: 1.2; }
  .tarjeta-sub { font-size: 14px; font-weight: 500; margin-top: 2px; }
  .mes { display: flex; justify-content: space-between; align-items: center; }
  .mes p { font-size: 16px; font-weight: 700; }
  .mes button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: #fff; color: var(--noche); display: flex; align-items: center; justify-content: center; }
  .mes button:hover:not(:disabled) { background: var(--linea); }
  .mes button:disabled { opacity: .4; }
  .semana, .dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
  .semana { text-align: center; font-size: 12px; font-weight: 700; color: var(--gris); }
  .dia { height: 44px; display: flex; align-items: center; justify-content: center; }
  .dia button { width: 44px; height: 44px; border: 0; border-radius: 50%; background: #fff; color: var(--noche); font-size: 15px; font-weight: 700; }
  .dia button:hover { background: var(--linea); }
  .dia button[aria-pressed="true"] { background: var(--noche); color: #fff; }
  .dia span { font-size: 15px; color: var(--gris-claro); }
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo label { font-size: 14px; font-weight: 700; }
  .campo label small { font-size: 14px; font-weight: 500; color: var(--gris); }
  .campo input, .campo textarea { width: 100%; border: 2px solid var(--borde); border-radius: 16px; background: #fff; padding: 0 16px; font-size: 16px; color: var(--noche); }
  .campo input { height: 52px; }
  .campo textarea { padding: 12px 16px; resize: vertical; }
  .campo input:focus, .campo textarea:focus { border-color: var(--noche); }
  ::placeholder { color: var(--gris-claro); opacity: 1; }
  .error-campo { font-size: 14px; font-weight: 500; color: #b42318; }
  .alerta { margin-bottom: 12px; border: 2px solid #b42318; background: #fef3f2; color: #7a271a; border-radius: 16px; padding: 12px 16px; font-size: 14px; font-weight: 500; }
  .solo-pc { display: none; }

  /* Gracias */
  .gracias { background: var(--naranja); min-height: 100dvh; }
  .gracias-col { max-width: 448px; margin: 0 auto; min-height: 100dvh; padding: 56px 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
  .mono { width: 240px; height: 240px; border-radius: 50%; background: #fff; overflow: hidden; }
  .mono img { width: 100%; height: 100%; object-fit: cover; }
  .antetitulo { font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
  .oido { font-family: var(--titulo); font-weight: 800; font-size: 52px; line-height: .95; letter-spacing: -1.5px; }
  .gracias-texto { font-size: 17px; line-height: 1.45; font-weight: 500; }
  .gracias-resumen { font-size: 15px; font-weight: 700; }
  .gracias-col .btn-principal { margin-top: auto; }

  /* ---------- Ordenador (desde 1024 px) ---------- */
  @media (min-width: 1024px) {
    .inicio-grid { max-width: 1152px; grid-template-columns: 1fr 1fr; gap: 64px; padding: 32px 48px; }
    .inicio-bloque { gap: 44px; }
    .marca { font-size: 128px; letter-spacing: -4px; }
    .lema { font-size: 34px; }
    .nota { font-size: 16px; }
    .miniaturas { display: none; }
    .btn-naranja { width: fit-content; min-width: 300px; }
    .collage { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .collage li:nth-child(even) { transform: translateY(40px); }
    .collage img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 4px solid var(--noche); }

    .contenedor { max-width: 1152px; padding: 40px; }
    .cabeza { padding: 0 0 32px; }
    .titulo { font-size: 48px; }
    .subtitulo { font-size: 18px; }
    .con-barra { padding-bottom: 40px; }
    .barra { display: none; }

    .platos-grid { display: grid; grid-template-columns: 1fr 340px; gap: 40px; }
    .fichas { padding: 0; grid-template-columns: 1fr 1fr; gap: 20px; }
    .ficha { flex-direction: column; padding: 16px; border-radius: 28px; }
    .ficha-foto { width: 100%; height: auto; aspect-ratio: 4 / 3; border-radius: 20px; }
    .ficha-accion { align-items: flex-end; }
    .ficha-desc { font-size: 14px; }
    .aviso { padding: 16px 0; font-size: 16px; }
    .panel { display: block; }
    .panel-caja { position: sticky; top: 40px; background: var(--bruma); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .panel-cabeza { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .panel-cabeza h2 { font-family: var(--titulo); font-weight: 800; font-size: 24px; }
    .panel .lista-item { gap: 12px; padding: 12px 0; }
    .panel .num { width: 24px; font-size: 16px; }
    .panel .lista-foto { width: 44px; height: 44px; border-radius: 10px; }
    .panel .lista-nombre { font-size: 15px; }
    .quitar-mini { width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; }
    .quitar-mini:hover { background: #fff; }
    .panel-vacio { font-size: 15px; line-height: 1.5; color: var(--tinta); }

    .resumen-grid { padding: 0; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr; column-gap: 40px; row-gap: 32px; grid-template-areas: "platos calendario" "datos calendario"; }
    .zona-calendario { position: sticky; top: 40px; align-self: start; }
    .lista-foto { width: 72px; height: 72px; }
    .lista-nombre { font-size: 18px; }
    .tarjeta { border-radius: 28px; padding: 24px; }
    .tarjeta h2 { font-size: 24px; }
    .solo-pc { display: block; margin-top: 20px; }

    .gracias-col { max-width: 576px; justify-content: center; padding-top: 32px; }
    .mono { width: 288px; height: 288px; }
    .oido { font-size: 72px; }
    .gracias-texto { font-size: 18px; }
    .gracias-col .btn-principal { margin-top: 16px; width: fit-content; min-width: 300px; }
  }
  @media (min-width: 1536px) {
    .fichas { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>

  var MONO = FOTOS["mono-cocinero"];
  var PLATOS = JSON.parse(document.getElementById("carta").textContent);
  var MAX = 5;
  var MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  var DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];

  // Dibujo provisional para los platos que aún no tienen foto
  var SIN_FOTO = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#14213D"/>' +
    '<circle cx="200" cy="178" r="96" fill="none" stroke="#FF9F1C" stroke-width="14"/>' +
    '<circle cx="200" cy="178" r="58" fill="#FF9F1C" opacity=".25"/>' +
    '<path d="M70 110v70M55 110v35a15 15 0 0 0 30 0v-35M70 180v80" stroke="#FF9F1C" stroke-width="10" stroke-linecap="round" fill="none"/>' +
    '<path d="M330 110c-22 10-22 60 0 70v80" stroke="#FF9F1C" stroke-width="10" stroke-linecap="round" fill="none"/>' +
    '<text x="200" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Foto en el horno</text></svg>');
  function tieneFoto(p) { return !!p.foto; }
  function foto(p) { return p.foto ? (FOTOS[p.foto] || p.foto) : SIN_FOTO; }
  function plato(id) { for (var i = 0; i < PLATOS.length; i++) if (PLATOS[i].id === id) return PLATOS[i]; return null; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  // ---------------- Fechas (siempre hora de Madrid) ----------------
  function hoy() { return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Madrid" }).format(new Date()); }
  function clave(a, m, d) { return a + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0"); }
  function entregable(c) { return !!c && /^\d{4}-\d{2}-\d{2}$/.test(c) && c > hoy(); }
  function fechaLarga(c) {
    var p = c.split("-").map(Number);
    var f = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return DIAS[f.getUTCDay()] + " " + p[2] + " de " + MESES[p[1] - 1];
  }

  // ---------------- Reglas ----------------
  function telefonoOk(t) { return /^\+?\d{9,15}$/.test(String(t).replace(/[\s.\-()]/g, "")); }
  function datosOk(c) { return c.nombre.trim() !== "" && telefonoOk(c.telefono) && c.direccion.trim() !== ""; }
  function validar(p) {
    if (!p.platos.length) return "Tu pedido está vacío. Elige al menos un plato.";
    if (p.platos.length > MAX) return "Como mucho " + MAX + " platos por pedido.";
    if (new Set(p.platos).size !== p.platos.length) return "Hay un plato repetido. Cada plato va una sola vez.";
    if (p.platos.some(function (id) { return !plato(id); })) return "Alguno de tus platos ya no está en la carta. Vuelve a elegir.";
    if (!entregable(p.fecha)) return "Elige un día de entrega a partir de mañana.";
    if (!p.cliente.nombre.trim()) return "Falta tu nombre.";
    if (!telefonoOk(p.cliente.telefono)) return "Revisa el teléfono: necesitamos uno válido para avisarte.";
    if (!p.cliente.direccion.trim()) return "Falta la dirección de entrega.";
    return null;
  }

  // ---------------- Estado (se guarda en sessionStorage) ----------------
  var CLAVE = "vastocupada-pedido";
  function vacio() { return { platos: [], fecha: null, cliente: { nombre: "", telefono: "", direccion: "", observaciones: "" }, confirmado: null, pedidoId: null }; }
  var st = vacio();
  try {
    var g = JSON.parse(sessionStorage.getItem(CLAVE) || "null");
    if (g) { st = Object.assign(vacio(), g); st.cliente = Object.assign(vacio().cliente, g.cliente || {}); }
  } catch (e) {}
  st.platos = st.platos.filter(function (id) { return !!plato(id); });
  function nuevoId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
  }
  function guardar() { try { sessionStorage.setItem(CLAVE, JSON.stringify(st)); } catch (e) {} }

  var ui = { enviando: false, error: null, telTocado: false, vista: null };

  // ---------------- Iconos ----------------
  function svg(d, size, w) { return '<svg width="' + (size || 20) + '" height="' + (size || 20) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; }
  var I = {
    der: svg("M5 12h14M13 6l6 6-6 6"),
    izq: svg("M19 12H5M11 6l-6 6 6 6"),
    ant: svg("M15 6l-6 6 6 6", 18),
    sig: svg("M9 6l6 6-6 6", 18),
    check: svg("M5 12.5l4.5 4.5L19 7.5", 24, 3),
    cruz: function (s) { return svg("M6 6l12 12M18 6L6 18", s || 18); }
  };

  // ---------------- Pantallas ----------------
  function contador() { return '<p class="contador">' + st.platos.length + " de " + MAX + " platos</p>"; }
  function cabecera(volver, etiqueta, titulo, sub) {
    return '<div class="cabeza"><div class="cabeza-fila"><a href="' + volver + '" class="btn-redondo" aria-label="' + etiqueta + '">' + I.izq + "</a>" + contador() + "</div>" +
      '<div><h1 class="titulo">' + titulo + '</h1><p class="subtitulo">' + sub + "</p></div></div>";
  }

  function vInicio() {
    var conFoto = PLATOS.filter(tieneFoto).slice(0, 4);
    var mini = conFoto.map(function (p) { return '<img src="' + foto(p) + '" alt="' + esc(p.nombre) + '">'; }).join("");
    var col = conFoto.map(function (p) { return '<li><img src="' + foto(p) + '" alt="' + esc(p.nombre) + '"></li>'; }).join("");
    return '<main class="inicio"><div class="inicio-grid"><div class="inicio-bloque">' +
      '<div class="inicio-marca"><div class="raya" aria-hidden="true"></div><h1 class="marca">VASTO<br>CUPADA</h1><p class="lema">Así es, vas to ocupada. Déjate cocinar.</p></div>' +
      '<div class="miniaturas-fila"><div class="miniaturas">' + mini + '</div><p class="nota">Hasta 5 platos distintos,<br>listos para toda la semana.</p></div>' +
      '<a href="#/platos" class="btn btn-naranja">Que cocine otro' + I.der + "</a>" +
      '</div><ul class="collage" aria-label="Platos de esta semana">' + col + "</ul></div></main>";
  }

  function botonVer() {
    return st.platos.length
      ? '<a href="#/pedido" class="btn btn-principal">Ver mi pedido</a>'
      : '<button type="button" class="btn btn-principal" disabled>Elige al menos un plato</button>';
  }

  function listaElegidos(mini) {
    return '<ol>' + st.platos.map(function (id, i) {
      var p = plato(id);
      return '<li class="lista-item"><span class="num">' + String(i + 1).padStart(2, "0") + '</span>' +
        '<img class="lista-foto" src="' + foto(p) + '" alt="' + (mini ? "" : esc(p.nombre)) + '">' +
        '<span class="lista-nombre">' + esc(p.nombre) + "</span>" +
        '<button type="button" class="' + (mini ? "quitar-mini" : "btn-redondo") + '" data-quitar="' + esc(id) + '" aria-label="Quitar ' + esc(p.nombre) + '">' + I.cruz(mini ? 16 : 18) + "</button></li>";
    }).join("") + "</ol>";
  }

  function vPlatos() {
    var lleno = st.platos.length >= MAX;
    var fichas = PLATOS.map(function (p) {
      var sel = st.platos.indexOf(p.id) >= 0;
      var bloq = !sel && lleno;
      return '<li class="ficha' + (sel ? " elegido" : "") + '">' +
        '<img class="ficha-foto" src="' + foto(p) + '" alt="' + esc(p.nombre) + '">' +
        '<div class="ficha-cuerpo"><div class="ficha-texto"><p class="categoria">' + esc(p.categoria) + '</p><h2 class="ficha-nombre">' + esc(p.nombre) + '</h2><p class="ficha-desc">' + esc(p.descripcion) + "</p></div>" +
        '<div class="ficha-accion"><button type="button" class="mas" data-plato="' + esc(p.id) + '" aria-pressed="' + sel + '" aria-label="Añadir ' + esc(p.nombre) + '"' +
        (bloq ? ' disabled title="Ya tienes 5 platos"' : ' title="' + (sel ? "Quitar del pedido" : "Añadir al pedido") + '"') + ">" + (sel ? I.check : "+1") + "</button></div></div></li>";
    }).join("");
    return '<div class="contenedor con-barra"><div class="platos-grid"><main>' +
      cabecera("#/", "Volver al inicio", "¿Qué te apetece?", "Máximo 5 platos y sin repetir. Elige con hambre.") +
      '<ul class="fichas">' + fichas + '</ul><p class="aviso" role="status">' + (lleno ? "Has llegado a los 5 platos. Quita uno si quieres cambiar." : "") + "</p></main>" +
      '<aside class="panel" aria-label="Tu pedido"><div class="panel-caja"><div class="panel-cabeza"><h2>Tu pedido</h2>' + contador() + "</div>" +
      (st.platos.length ? listaElegidos(true) : '<p class="panel-vacio">Aquí no hay nada todavía. Tu nevera te está mirando con preocupación.</p>') +
      botonVer() + "</div></aside></div></div>" +
      '<div class="barra"><div>' + botonVer() + "</div></div>";
  }

  function vCalendario() {
    var h = hoy(), hp = h.split("-").map(Number);
    if (!ui.vista) { var base = (entregable(st.fecha) ? st.fecha : h).split("-").map(Number); ui.vista = { a: base[0], m: base[1] - 1 }; }
    var v = ui.vista;
    var enActual = v.a === hp[0] && v.m === hp[1] - 1;
    var huecos = (new Date(Date.UTC(v.a, v.m, 1)).getUTCDay() + 6) % 7;
    var total = new Date(Date.UTC(v.a, v.m + 1, 0)).getUTCDate();
    var fecha = entregable(st.fecha) ? st.fecha : null;
    var celdas = "";
    for (var i = 0; i < huecos; i++) celdas += '<div class="dia"></div>';
    for (var d = 1; d <= total; d++) {
      var c = clave(v.a, v.m, d);
      celdas += '<div class="dia">' + (c > h
        ? '<button type="button" data-dia="' + c + '" aria-pressed="' + (c === fecha) + '" aria-label="' + fechaLarga(c) + '">' + d + "</button>"
        : '<span aria-hidden="true">' + d + "</span>") + "</div>";
    }
    var nombreMes = MESES[v.m].charAt(0).toUpperCase() + MESES[v.m].slice(1);
    return '<section class="tarjeta" aria-labelledby="t-cal"><div><h2 id="t-cal">¿Qué día te lo llevamos?</h2><p class="tarjeta-sub" aria-live="polite">' +
      (fecha ? "Entrega: " + fechaLarga(fecha) : "Elige un día en el calendario.") + "</p></div>" +
      '<div class="mes"><button type="button" data-mes="-1" aria-label="Mes anterior"' + (enActual ? " disabled" : "") + ">" + I.ant + '</button><p aria-live="polite">' + nombreMes + " " + v.a + '</p><button type="button" data-mes="1" aria-label="Mes siguiente">' + I.sig + "</button></div>" +
      '<div class="semana" aria-hidden="true"><div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div></div>' +
      '<div class="dias">' + celdas + "</div></section>";
  }

  function textoPedir() {
    if (ui.enviando) return "Mandando a cocina…";
    if (!st.platos.length) return "Elige al menos un plato";
    if (!entregable(st.fecha)) return "Elige el día de entrega";
    if (!datosOk(st.cliente)) return "Rellena tus datos";
    return "Pedir menú semanal";
  }
  function puedePedir() { return !ui.enviando && st.platos.length > 0 && entregable(st.fecha) && datosOk(st.cliente); }
  function zonaPedir() {
    return (ui.error ? '<p class="alerta" role="alert">' + esc(ui.error) + "</p>" : "") +
      '<button type="submit" form="form-pedido" class="btn btn-principal js-pedir"' + (puedePedir() ? "" : " disabled") + ">" + textoPedir() + "</button>";
  }

  function campo(id, etiqueta, extra) {
    return '<div class="campo"><label for="' + id + '">' + etiqueta + "</label>" + extra + "</div>";
  }

  function vPedido() {
    var c = st.cliente;
    var telMal = ui.telTocado && c.telefono.trim() !== "" && !telefonoOk(c.telefono);
    return '<div class="contenedor con-barra">' +
      cabecera("#/platos", "Volver a los platos", "Tu pedido", "Repasa tu menú antes de mandarlo a cocina.") +
      '<div class="resumen-grid">' +
      '<section class="zona-platos" aria-label="Platos elegidos">' +
      (st.platos.length ? listaElegidos(false) : '<p class="vacio">Aquí no hay nada todavía. Tu nevera te está mirando con preocupación.</p>') +
      '<a href="#/platos" class="btn btn-secundario" style="margin-top:8px">Añadir o cambiar platos</a></section>' +
      '<div class="zona-calendario"><div id="calendario">' + vCalendario() + '</div><div class="solo-pc js-zona-pedir">' + zonaPedir() + "</div></div>" +
      '<form id="form-pedido" class="tarjeta zona-datos" novalidate aria-labelledby="t-datos" style="gap:16px">' +
      '<div><h2 id="t-datos">¿A quién se lo llevamos?</h2><p class="tarjeta-sub">Lo justo para que el táper llegue a buen puerto.</p></div>' +
      campo("nombre", "Nombre", '<input id="nombre" name="nombre" autocomplete="name" required maxlength="100" placeholder="Cómo te llamamos" value="' + esc(c.nombre) + '">') +
      campo("telefono", "Teléfono", '<input id="telefono" name="telefono" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20" placeholder="600 000 000" value="' + esc(c.telefono) + '"' + (telMal ? ' aria-invalid="true" aria-describedby="tel-error"' : "") + ">" +
        '<p id="tel-error" class="error-campo"' + (telMal ? "" : " hidden") + ">Ese teléfono no cuadra. Mínimo 9 cifras, sin trampas.</p>") +
      campo("direccion", "Dirección de entrega", '<input id="direccion" name="direccion" autocomplete="street-address" required maxlength="300" placeholder="Calle, número, piso y puerta" value="' + esc(c.direccion) + '">') +
      campo("observaciones", 'Observaciones <small>(opcional)</small>', '<textarea id="observaciones" name="observaciones" rows="3" maxlength="500" placeholder="Alergias, timbre que no suena, el perro no muerde…">' + esc(c.observaciones) + "</textarea>") +
      "</form></div></div>" +
      '<div class="barra"><div class="js-zona-pedir">' + zonaPedir() + "</div></div>";
  }

  function vGracias() {
    var k = st.confirmado;
    var n = k.platos === 1 ? "1 plato" : k.platos + " platos";
    return '<main class="gracias fondo-naranja"><div class="gracias-col">' +
      '<div class="mono"><img src="' + MONO + '" alt="Un monito con peto lila cocinando en una sartén"></div>' +
      '<p class="antetitulo">Tu menú se está cocinando</p><h1 class="oido">¡Oído cocina!</h1>' +
      '<p class="gracias-texto">Gracias por tu pedido. Ya hay alguien sudando entre fogones por ti, así que relájate: esta semana la sartén ni la mires.</p>' +
      '<p class="gracias-resumen">Has pedido ' + n + " para el " + fechaLarga(k.fecha) + ".</p>" +
      '<button type="button" class="btn btn-principal" data-volver>Volver al inicio</button></div></main>';
  }

  // ---------------- Navegación ----------------
  var app = document.getElementById("app");
  var TITULOS = { "/": "VASTOCUPADA · Déjate cocinar", "/platos": "¿Qué te apetece? · VASTOCUPADA", "/pedido": "Tu pedido · VASTOCUPADA", "/gracias": "¡Oído cocina! · VASTOCUPADA" };
  function ruta() { var r = location.hash.replace(/^#/, "") || "/"; return TITULOS[r] ? r : "/"; }

  function render(mantenerFoco) {
    var r = ruta();
    if (r === "/gracias" && !st.confirmado) { location.replace("#/"); return; }
    var foco = mantenerFoco && document.activeElement ? selectorDe(document.activeElement) : null;
    app.innerHTML = r === "/platos" ? vPlatos() : r === "/pedido" ? vPedido() : r === "/gracias" ? vGracias() : vInicio();
    document.title = TITULOS[r];
    if (foco) { var el = app.querySelector(foco); if (el && !el.disabled) el.focus(); }
  }
  function selectorDe(el) {
    var attrs = ["data-plato", "data-quitar", "data-dia", "data-mes"];
    for (var i = 0; i < attrs.length; i++) if (el.hasAttribute && el.hasAttribute(attrs[i])) return "[" + attrs[i] + '="' + el.getAttribute(attrs[i]) + '"]';
    return el.id ? "#" + el.id : null;
  }
  function anunciar(t) { var a = document.getElementById("anuncio"); a.textContent = ""; setTimeout(function () { a.textContent = t; }, 50); }

  window.addEventListener("hashchange", function () {
    ui.error = null; ui.vista = null;
    render(false);
    window.scrollTo(0, 0);
    var h = app.querySelector("h1"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); h.style.outline = "none"; }
  });

  // Solo actualiza el botón de pedir (para no perder el foco al escribir)
  function refrescarPedir() {
    app.querySelectorAll(".js-zona-pedir").forEach(function (z) { z.innerHTML = zonaPedir(); });
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button, a");
    if (!b || b.disabled) return;
    if (b.hasAttribute("data-plato")) {
      var id = b.getAttribute("data-plato");
      var i = st.platos.indexOf(id);
      if (i >= 0) st.platos.splice(i, 1); else if (st.platos.length < MAX) st.platos.push(id);
      guardar(); render(true);
      anunciar(st.platos.length + " de " + MAX + " platos");
    } else if (b.hasAttribute("data-quitar")) {
      st.platos = st.platos.filter(function (x) { return x !== b.getAttribute("data-quitar"); });
      guardar(); render(false);
      anunciar("Plato quitado. " + st.platos.length + " de " + MAX + " platos");
    } else if (b.hasAttribute("data-dia")) {
      st.fecha = b.getAttribute("data-dia");
      guardar();
      document.getElementById("calendario").innerHTML = vCalendario();
      app.querySelector('[data-dia="' + st.fecha + '"]').focus();
      refrescarPedir();
    } else if (b.hasAttribute("data-mes")) {
      var d = new Date(Date.UTC(ui.vista.a, ui.vista.m + Number(b.getAttribute("data-mes")), 1));
      ui.vista = { a: d.getUTCFullYear(), m: d.getUTCMonth() };
      var paso = b.getAttribute("data-mes");
      document.getElementById("calendario").innerHTML = vCalendario();
      var mismo = app.querySelector('[data-mes="' + paso + '"]');
      (mismo && !mismo.disabled ? mismo : app.querySelector('[data-mes="1"]')).focus();
    } else if (b.hasAttribute("data-volver")) {
      st = vacio(); guardar(); location.hash = "#/";
    }
  });

  app.addEventListener("input", function (e) {
    var t = e.target;
    if (st.cliente.hasOwnProperty(t.name)) {
      st.cliente[t.name] = t.value; guardar(); refrescarPedir();
      if (t.name === "telefono" && ui.telTocado) actualizarTel();
    }
  });
  app.addEventListener("focusout", function (e) {
    if (e.target.name === "telefono") { ui.telTocado = true; actualizarTel(); }
  });
  function actualizarTel() {
    var input = document.getElementById("telefono"), err = document.getElementById("tel-error");
    var mal = st.cliente.telefono.trim() !== "" && !telefonoOk(st.cliente.telefono);
    err.hidden = !mal;
    if (mal) { input.setAttribute("aria-invalid", "true"); input.setAttribute("aria-describedby", "tel-error"); }
    else { input.removeAttribute("aria-invalid"); input.removeAttribute("aria-describedby"); }
  }

  app.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!puedePedir()) return;
    var pedido = { platos: st.platos.slice(), fecha: st.fecha, cliente: st.cliente };
    var fallo = validar(pedido);
    if (fallo) { ui.error = fallo; refrescarPedir(); return; }
    ui.enviando = true; ui.error = null; refrescarPedir();

    // Mismo número en los reintentos: la cocina no lo apunta dos veces
    if (!st.pedidoId) { st.pedidoId = nuevoId(); guardar(); }
    var completo = {
      id: st.pedidoId,
      platos: pedido.platos.slice(),
      fechaEntrega: pedido.fecha,
      fechaEntregaTexto: fechaLarga(pedido.fecha),
      cliente: { nombre: st.cliente.nombre.trim(), telefono: st.cliente.telefono.trim(), direccion: st.cliente.direccion.trim(), observaciones: st.cliente.observaciones.trim() },
      creado: new Date().toISOString()
    };

    var envio = window.VASTO_ENDPOINT
      ? fetch(window.VASTO_ENDPOINT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(completo) })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.ok === false) throw new Error(j.error || "La cocina no ha contestado bien."); }); })
      : new Promise(function (ok) { console.info("[pedido · modo demostración]", completo); setTimeout(ok, 500); });

    envio.then(function () {
      ui.enviando = false;
      st = vacio(); st.confirmado = { platos: completo.platos.length, fecha: completo.fechaEntrega }; guardar();
      location.hash = "#/gracias";
    }).catch(function (err) {
      ui.enviando = false;
      var detalle = err instanceof TypeError ? "No hemos podido conectar con la cocina. Revisa tu conexión." : (err && err.message) || "Algo se ha quemado por el camino.";
      ui.error = detalle + " Tu pedido sigue aquí tal cual: vuelve a intentarlo.";
      refrescarPedir();
    });
  });

  render(false);
})();
</script>
</body>
</html>
